[project]
name = "alprg"
version = "0.1.0"
description = "Multi-engine ALPR classification harness (companion library for PlateShapez)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
# GPU-accelerated fast-alpr (the original ALPRGbatch.py stack).
fast-alpr = ["fast-alpr[onnx-gpu]", "onnxruntime-gpu", "opencv-python"]
# CPU-only fast-alpr, for machines without a CUDA GPU.
fast-alpr-cpu = ["fast-alpr", "opencv-python"]
# OpenALPR's Python bindings are NOT pip-installable: they bind to a system-level
# `libopenalpr` C++ library built/installed per https://github.com/openalpr/openalpr.
# This group is an intentional no-op placeholder that documents the requirement;
# OpenALPREngine.is_available() reflects whether the system binding is importable.
openalpr = []
all = ["alprg[fast-alpr,openalpr]"]

[project.scripts]
alprg = "alprg.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.4.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort (imports)
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["fast_alpr.*", "openalpr.*", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
